<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İCY Birlik Tarım | Demo</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.6.1/dist/css/tabler.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css"><style>:root{--tblr-primary:#23815a}body{min-height:100vh}.sidebar{width:235px;min-height:100vh;background:#fff;border-right:1px solid #ddd}.sidebar a{display:block;padding:11px 16px;color:inherit;text-decoration:none;border-radius:8px;cursor:pointer}.sidebar a.active{background:#e8f6ee;color:#167044;font-weight:700}.content{flex:1;min-width:0}.metric{font-size:1.6rem;font-weight:750}.muted{color:#6b7280}.hidden{display:none!important}@media(max-width:760px){.sidebar{width:100%;min-height:0;border-right:0}.layout{display:block!important}.navlinks{display:flex;overflow:auto}.sidebar a{white-space:nowrap}.metric{font-size:1.3rem}}</style></head><body><div class="layout d-flex"><aside class="sidebar p-3"><div class="h2 text-success mb-4"><i class="ti ti-plant-2"></i> İCY Birlik Tarım</div><div class="mb-3"><label class="form-label">Portal</label><select id="portal" class="form-select"><option value="staff">Şirket Personeli</option><option value="dealer">Bayi</option></select></div><div class="navlinks" id="nav"></div><div class="text-secondary small mt-4">Tabler 1.6.1 · Önizleme</div></aside><main class="content"><header class="navbar navbar-expand-md bg-white border-bottom px-4"><div class="container-fluid p-0"><span id="pageTitle" class="h2 mb-0">Genel Bakış</span><div class="ms-auto d-flex gap-2"><button class="btn btn-outline-secondary" onclick="toggleTheme()"><i class="ti ti-moon"></i> Tema</button><button class="btn btn-outline-secondary" onclick="alert('Yeni bildirim bulunmuyor')"><i class="ti ti-bell"></i></button></div></div></header><div class="container-xl py-4"><div class="alert alert-info"><i class="ti ti-info-circle"></i> Bu, sistemin canlı web önizlemesidir. Veriler örnektir; gerçek finansman işlemi yapılmaz.</div><div id="view"></div></div></main></div><script>const staff=['Genel Bakış','Finansman Başvuruları','Belge İnceleme','Onay İşlemleri','Bayiler ve Çiftçiler','Senet Takibi','Tahsilatlar','Mesajlar','Raporlar','Yetkilendirme'];const dealer=['Genel Bakış','Finansman Başvurularım','Çiftçi Başvuruları','Yeni Başvuru','Çiftçiler','Senet ve Ödemeler','Mesajlar'];let portal='staff',page='Genel Bakış';const records=[['TF-2026-001','Murat Arslan','Buğday tohumu','₺185.000','Belge Kontrolünde'],['TF-2026-002','Bereket Tarım Bayi','Gübre','₺320.000','Onay Bekliyor'],['TF-2026-003','Ayşe Demir','Mısır tohumu','₺98.000','Onaylandı'],['TF-2026-004','Mehmet Çelik','İlaç','₺42.000','Reddedildi']];const money=(n)=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(n);function card(t,v,icon){return '<div class="col-sm-6 col-xl-3"><div class="card"><div class="card-body"><div class="text-secondary">'+t+'</div><div class="metric mt-2"><i class="ti ti-'+icon+' text-success"></i> '+v+'</div></div></div></div>'}function table(){return '<div class="card"><div class="card-header"><h3 class="card-title">Başvurular</h3></div><div class="table-responsive"><table class="table table-vcenter card-table"><thead><tr><th>Başvuru No</th><th>Başvuran</th><th>Ürün</th><th>Tutar</th><th>Durum</th><th></th></tr></thead><tbody>'+records.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td><span class="badge bg-azure-lt">'+r[4]+'</span></td><td><button class="btn btn-sm" onclick="alert(\''+r[0]+' · '+r[4]+'\')">Detay</button></td></tr>').join('')+'</tbody></table></div></div>'}function dashboard(){return '<div class="row g-3 mb-4">'+card(portal==='staff'?'Toplam Başvuru':'Kullanılabilir Limit',portal==='staff'?'128':money(750000),'clipboard-list')+card(portal==='staff'?'Onay Bekleyen':'Kullanılan Limit',portal==='staff'?'18':money(250000),'clock')+card('Aktif Finansman',money(2400000),'wallet')+card('Bekleyen Senet','12','file-description')+'</div><div class="row g-3 mb-4"><div class="col-lg-7">'+table()+'</div><div class="col-lg-5"><div class="card h-100"><div class="card-header"><h3 class="card-title">Tarımsal Ürün Fiyatları</h3></div><div class="card-body"><p class="text-secondary small">Gösterilecek ürünleri seçin (örnek fiyatlar).</p><div id="prices"></div><div class="mt-3"><label class="form-label">Gösterilecek ürünler</label><div class="d-flex flex-wrap gap-2">'+['Buğday','Arpa','Mısır','Ayçiçeği'].map(x=>'<label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" onchange="setPrice(\''+x+'\',this.checked)" '+(selected.includes(x)?'checked':'')+'><span class="form-check-label">'+x+'</span></label>').join('')+'</div></div><p class="small text-secondary mt-3">Fiyatlar canlı piyasa verisi değildir.</p></div></div></div></div>'}let selected=JSON.parse(localStorage.getItem('prices')||'["Buğday","Arpa","Mısır"]');function setPrice(x,on){selected=on?[...new Set([...selected,x])]:selected.filter(y=>y!==x);localStorage.setItem('prices',JSON.stringify(selected));renderPrices()}function renderPrices(){let el=document.getElementById('prices');if(!el)return;let d={'Buğday':['🌾','₺12,80 / kg'],'Arpa':['🌱','₺10,50 / kg'],'Mısır':['🌽','₺11,25 / kg'],'Ayçiçeği':['🌻','₺24,40 / kg']};el.innerHTML=selected.map(x=>'<div class="d-flex justify-content-between border-bottom py-2"><span>'+d[x][0]+' '+x+'</span><strong>'+d[x][1]+'</strong></div>').join('')||'<p class="text-secondary">Ürün seçilmedi.</p>'}function application(){return '<div class="card"><div class="card-header"><h3 class="card-title">Yeni Finansman Başvurusu</h3></div><div class="card-body"><div class="row g-3"><div class="col-md-6"><label class="form-label">Başvuru Türü</label><select class="form-select"><option>Bayi Finansmanı</option><option>Çiftçi Finansmanı</option></select></div><div class="col-md-6"><label class="form-label">Başvuran</label><input class="form-control" placeholder="Ad soyad / işletme"></div><div class="col-md-6"><label class="form-label">Ürün</label><input class="form-control" placeholder="Ürün adı"></div><div class="col-md-6"><label class="form-label">Tutar (₺)</label><input class="form-control" type="number"></div><div class="col-12"><button class="btn btn-primary" onclick="alert('Bu sayfa bir önizlemedir. Başvuru kaydı için backend gereklidir.')">Başvuruyu Oluştur</button></div></div></div></div>'}function render(){const nav=document.getElementById('nav');nav.innerHTML=(portal==='staff'?staff:dealer).map(x=>'<a class="'+(x===page?'active':'')+'" onclick="go(\''+x+'\')">'+x+'</a>').join('');document.getElementById('pageTitle').textContent=page;document.getElementById('view').innerHTML=page==='Genel Bakış'?dashboard():page==='Yeni Başvuru'?application():page.includes('Başvuru')||page.includes('Onay')||page.includes('Belge')?table():'<div class="card"><div class="card-body"><h3>'+page+'</h3><p class="text-secondary">Bu bölümün ayrıntılı ekranı geliştirilmektedir. Canlı önizleme içinde menü geçişleri çalışır.</p></div></div>';renderPrices()}function go(p){page=p;render()}document.getElementById('portal').onchange=e=>{portal=e.target.value;page='Genel Bakış';render()};function toggleTheme(){let d=document.documentElement;d.setAttribute('data-bs-theme',d.getAttribute('data-bs-theme')==='dark'?'light':'dark')}render();</script></body></html>
